alerts:
  - name: HighLatencyP95
    severity: warning
    condition: "p95(response_sent.latency_ms) > 1000"
    duration: 5m
    type: symptom-based
    channel: "#k4-l3b-alerts"
    owner: student-2A202602504
    runbook: docs/alerts.md#alert-1
  - name: ElevatedErrorRate
    severity: critical
    condition: "error_rate_pct > 2"
    duration: 5m
    type: symptom-based
    channel: "#k4-l3b-alerts"
    owner: student-2A202602504
    runbook: docs/alerts.md#alert-2
  - name: RetrievalSuccessDrop
    severity: warning
    condition: "retrieval_success_rate_pct < 90"
    duration: 10m
    type: symptom-based
    channel: "#k4-l3b-alerts"
    owner: student-2A202602504
    runbook: docs/alerts.md#alert-3
