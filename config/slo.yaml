service: day13-l3b-monitoring-llmops-lab
primary_slo:
  name: fast_successful_requests
  window: 28d
  sli:
    good_event: 'event == "response_sent" and latency_ms <= 3000'
    total_event: 'event == "request_received"'
  target_percent: 99.5
  error_budget_percent: 0.5
  note: >
    Giữ target 99.5% và ngưỡng 3000ms đúng contract dashboard. Baseline 10 request
    ngày 2026-09-30: latency P50 158ms, P95/P99 161ms, TTFT P95 55ms, quality 0.88,
    tổng cost 0.018 USD, 0 lỗi. SLO 99.5% trong 28 ngày có error budget 0.5%.
    Với 10,000 request thì tối đa 50 request được phép lỗi hoặc chậm hơn 3000ms.
    Practice rag_slow làm latency nội bộ khoảng 2666ms, retrieval khoảng 2505ms:
    chưa vượt SLO 3000ms nhưng gấp khoảng 16 lần baseline. Alert warning đặt ở
    P95 > 1000ms trong 5 phút để báo trước khi error budget bị đốt.
guardrails:
  error_rate_pct_max: 2
  daily_cost_usd_max: 2.5
  quality_score_avg_min: 0.75
  retrieval_success_rate_pct_min: 90
